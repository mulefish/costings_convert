<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Costings - Jarvis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='headers.js') }}"></script>
    <script>
        (function () {
            const export_sections_toggle = {
                "Origin Warehouse": false,
                "Inland Logistics": false,
                "Consolidation": false,
                "Outbound Logistics": false,
                "Documentation": false,
                "CIF": false,
                "Total Terms": true,
                "Premium and Discounts": true,
            };
            window.EXPORT_SECTIONS_TOGGLE_DEFAULTS = export_sections_toggle;
        })();
    </script>
</head>
<body>

    <header class="app-header">
        <h1 class="app-brand">Jarvis</h1>
        <nav class="app-nav" id="app_nav" aria-label="Views">
            <button type="button" class="app-nav-btn is-active" data-view="Jarvis">Jarvis</button>
            <button type="button" class="app-nav-btn" data-view="Notes">Notes</button>
            <button type="button" class="app-nav-btn" data-view="OTR">OTR</button>
            <button type="button" class="app-nav-btn" data-view="OCEAN">OCEAN</button>
            <button type="button" class="app-nav-btn" data-view="Ocean Costing">Ocean Costing</button>
            <button type="button" class="app-nav-btn" data-view="Seam Tariffs">Seam Tariffs</button>
            <button type="button" class="app-nav-btn" data-view="Cert Tariffs">Cert Tariffs</button>
            <button type="button" class="app-nav-btn" data-view="USD">USD</button>
            <button type="button" class="app-nav-btn" data-view="PTS">PTS</button>
            <button type="button" class="app-nav-btn" data-view="CIF">CIF</button>
            <button type="button" class="app-nav-btn" data-view="Regions and Ports">Regions and Ports</button>
            <button type="button" class="app-nav-btn" data-view="Export">Export</button>
        </nav>
    </header>
	<p class='note'>Global rates and USD inputs: choose <strong>Jarvis</strong>, edit numbers, click <strong>Save</strong> (writes to the SQLite database). In <strong>USD</strong> Outbound, <strong>Ocean base</strong> uses the <strong>drayage</strong> table: each row’s export <strong>Port</strong> maps to a drayage region, then <strong>OceanBase &divide; 88</strong>. Or open <a href="#jarvis">#jarvis</a>.</p>
    <main class="app-main">
        <div id="cell-derivation"></div>
        <div id="content"></div>
    </main>

    <script src="{{ url_for('static', filename='usd.js') }}"></script>
    <script src="{{ url_for('static', filename='pts.js') }}"></script>
    <script src="{{ url_for('static', filename='cif.js') }}"></script>
    <script src="{{ url_for('static', filename='db.js') }}"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
